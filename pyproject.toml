[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-deepagents-tensorlake"
description = "Tensorlake sandbox and Cloud Volume filesystem backends for Deep Agents"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
version = "0.1.1"

classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents>=0.7",
    "tensorlake>=0.5.151,<0.6",
]

[project.urls]
Homepage = "https://github.com/keepzero/langchain-deepagents-tensorlake"
Repository = "https://github.com/keepzero/langchain-deepagents-tensorlake"

[tool.hatch.build.targets.wheel]
packages = ["langchain_deepagents_tensorlake"]

[tool.uv]
constraint-dependencies = ["urllib3>=2.6.3"]

[dependency-groups]
test = [
    "pytest>=7.3.0,<10.0.0",
    "pytest-cov",
    "pytest-socket",
    "pytest-xdist",
    "pytest-timeout>=2.3.1,<3.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.13.1,<0.16.0",
    "ty>=0.0.1,<1.0.0",
    "langchain-tests>=1.1.4",
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
division-by-zero = "error"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "ANN401",
]
extend-safe-fixes = ["PLR6201"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
testpaths = ["tests/unit_tests"]
markers = [
    "requires: mark tests as requiring a specific library",
    "compile: mark placeholder test used to compile integration tests without running them",
    "scheduled: mark tests to run in scheduled testing",
    "integration: requires a real Tensorlake project",
]
asyncio_mode = "auto"
filterwarnings = []

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["D", "S101"]
"tests/**/test_filesystem.py" = ["ARG005", "PLR2004"]
"tests/**/test_backend_contract.py" = ["ARG005", "PLR2004"]
