name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        deepagents: ["locked"]
        include:
          - python-version: "3.11"
            deepagents: "0.7.0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-groups
      - if: matrix.deepagents != 'locked'
        run: uv pip install "deepagents==${{ matrix.deepagents }}"
      - run: make test PYTEST_EXTRA="-n auto -q"
        env:
          UV_NO_SYNC: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check langchain_deepagents_tensorlake
      - run: uv build
